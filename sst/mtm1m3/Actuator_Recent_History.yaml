title: MTM1M3 Actuator bump test recent history
description: Plots the recent failures of all of the actuators - will take 1-2 minutes.
authors:
  - name: Craig Lage
    slack: cslage
tags:
  - demo
parameters:
  day_obs:
    type: string
    description: Observation day in format YYYYMMDD
    default: "20260701"
  days_to_plot:
    type: integer
    description: Number of days to look forward (max = 5)
    default: 5
    minimum: 0
    maximum: 5